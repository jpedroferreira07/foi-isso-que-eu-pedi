# Publica o site no GitHub Pages a cada push na main.
# Antes do primeiro uso: no GitHub, abra Settings > Pages e escolha
# "Source: GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite rodar manualmente pela aba Actions

# Permissões necessárias para publicar no Pages (e nada além disso).
permissions:
  contents: read
  pages: write
  id-token: write

# Só uma publicação por vez.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Copia SÓ o que o site usa (sem a pasta docs, o material de referência e os arquivos de configuração).
      - name: Montar a pasta do site
        run: |
          mkdir -p _site/validador
          cp index.html _site/
          cp validador-offline/validador-v2.html _site/validador/index.html
          cp -r jogo-fisico manual-do-professor video-de-apresentacao apresentacao _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
